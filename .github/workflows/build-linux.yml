name: Build tool on Linux
on:
  push:
  pull_request:
jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
     MAKEFLAGS: -j4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
         sudo apt-get install --yes \
           gcc g++ cmake libgmp-dev libboost-dev libboost-filesystem-dev \
           libboost-thread-dev libboost-test-dev \
           libsqlite3-dev libtbb-dev libz-dev libedit-dev \
           python3 python3-pip \
           llvm-18 llvm-18-dev llvm-18-tools clang-18
      - name: Compile IKOS
        run: |
          mkdir build
          cd build
          cmake \
            -DCMAKE_INSTALL_PREFIX="/opt/ikos" \
            -DCMAKE_BUILD_TYPE="Debug" \
            -DLLVM_CONFIG_EXECUTABLE="/usr/lib/llvm-18/bin/llvm-config" \
            ..
          make
          sudo make install
      - name: Add IKOS to the path
        run: |
          echo "/opt/ikos/bin" >> $GITHUB_PATH
      - name: Confirm that it runs
        run: |
          ikos --version

      # The core unit-test binaries hang off a custom `build-core-tests` target
      # and are NOT part of the default `all`. Skipping this step makes ctest
      # report 37 tests as "Not Run" and fail the job -- verified locally.
      - name: Build core unit tests
        run: |
          cd build
          make build-core-tests

      - name: Cache InterflopBench
        id: ifb-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/interflopbench
          key: interflopbench-examples-v1

      # Tier 2 and Tier 3 of the floating-point validation run against
      # InterflopBench. The test SKIPs (exit 77) when the checkout is absent,
      # so without this step the suite would go green while never checking a
      # single per-input floating-point verdict -- green by absence, which is
      # worse than no test at all.
      #
      # Upstream being unreachable must not redden our CI, so a failed clone is
      # non-fatal. It clears the directory first so a half-written checkout can
      # never land in the cache and poison later runs.
      - name: Fetch InterflopBench
        if: steps.ifb-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          rm -rf "$HOME/.cache/interflopbench"
          git clone --filter=blob:none --sparse \
              https://github.com/interflop/InterflopBench \
              "$HOME/.cache/interflopbench"
          git -C "$HOME/.cache/interflopbench" sparse-checkout set examples

          # Never cache a half-written checkout. If examples/ is missing the
          # bench dir still exists, so a later run would restore a useless cache
          # and skip Tier 2/3 forever instead of retrying. Wipe it and warn.
          if [ ! -d "$HOME/.cache/interflopbench/examples" ]; then
            echo "::warning::InterflopBench examples missing -- FP Tier 2/3 will skip"
            rm -rf "$HOME/.cache/interflopbench"
            exit 1
          fi

      - name: Run test suite
        run: |
          cd build
          ctest --output-on-failure

      # ctest hides a passing test's stdout, so the InterflopBench scorecard --
      # the only place the modelling coverage and precision tallies appear --
      # used to vanish on every green run. The exit-code guards still fire on a
      # regression, but nothing showed the numbers, so slow shrinkage was
      # invisible. always(): a failed run is exactly when we want the table.
      - name: Summarise InterflopBench
        if: always()
        run: |
          python3 test/fp/interflopbench/ci_summary.py \
            "${{ github.workspace }}/build/interflopbench-report.json"

      - name: Upload InterflopBench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interflopbench-report-linux
          path: build/interflopbench-report.json
          if-no-files-found: ignore
          retention-days: 30
